packages:
  - packages/*
  - tooling/*
  - apps/*

nodeLinker: hoisted
saveExact: true
engineStrict: true

supportedArchitectures:
  os: [current, linux]
  cpu: [current, arm64]
  libc: [current, glibc]

minimumReleaseAgeExclude:
  - react-native
  - '@react-native/*'
  - '@react-native-community/*'
  - expo
  - 'expo-*'
  - '@expo/*'
  - babel-preset-expo
  - babel-plugin-react-compiler
  - electron@44.7.0
  - re2js@2.8.8

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  cpu-features: false
  electron: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  koffi: true
  node-pty: true
  protobufjs: false
  ssh2: false
  usocket: false

overrides:
  '@expo/cli': 57.0.33
  '@expo/log-box': 57.0.4
  '@expo/metro-config': 57.0.14
  '@earendil-works/pi-ai': 1.4.0
  react-native-worklets: 0.13.0
  '@react-native/metro-config': 0.86.3
  uuid@<11.1.1: '>=11.1.1'
  qs@<6.16.0: '>=6.16.0'
  decode-uri-component@<=0.4.2: 0.5.0
  basic-ftp@<=6.2.0: 6.2.1

patchedDependencies:
  '@deepseek-ai/dsh-session@0.2.1-rc.3': patches/@deepseek-ai__dsh-session@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-subagent@0.2.1-rc.3': patches/@deepseek-ai__dsh-subagent@0.2.1-rc.3.patch
  '@deepseek-ai/dsh-working-directory@0.2.1-rc.3': patches/@deepseek-ai__dsh-working-directory@0.2.1-rc.3.patch
  '@discordjs/ws@2.0.4': patches/@discordjs__ws@2.0.4.patch
  '@shopify/flash-list@2.3.3': patches/@shopify__flash-list@2.3.3.patch
  '@stream-io/react-native-webrtc@145.4.1': patches/@stream-io__react-native-webrtc@145.4.1.patch
  braces@3.0.3: patches/braces@3.0.3.patch
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
  dsh-plugin-codegraph-service@0.1.6: patches/dsh-plugin-codegraph-service@0.1.6.patch
  dsh-plugin-codegraph-sqlite@0.1.6: patches/dsh-plugin-codegraph-sqlite@0.1.6.patch
  dsh-plugin-codegraph-tool@0.1.6: patches/dsh-plugin-codegraph-tool@0.1.6.patch
  dsh-plugin-codegraph-tree-sitter@0.1.6: patches/dsh-plugin-codegraph-tree-sitter@0.1.6.patch
  expo-updates@57.0.26: patches/expo-updates@57.0.26.patch
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  openrgb-sdk@0.6.0: patches/openrgb-sdk@0.6.0.patch
  react-native@0.86.3: patches/react-native@0.86.3.patch

packageExtensions:
  dsh-plugin-codegraph-service:
    peerDependenciesMeta:
      '@deepseek-ai/dsh-invariants':
        optional: true
  dsh-plugin-codegraph-sqlite:
    peerDependenciesMeta:
      '@deepseek-ai/dsh-invariants':
        optional: true
  dsh-plugin-codegraph-tool:
    peerDependenciesMeta:
      '@deepseek-ai/dsh-invariants':
        optional: true
  dsh-plugin-codegraph-tree-sitter:
    peerDependenciesMeta:
      '@deepseek-ai/dsh-invariants':
        optional: true

auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
