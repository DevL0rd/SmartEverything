plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.healthconnect'
version = '0.1.0'

android {
  namespace "expo.modules.healthconnect"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation "androidx.health.connect:connect-client:1.1.0"
  implementation "androidx.work:work-runtime-ktx:2.12.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
  implementation "io.netty:netty-codec-http:4.1.139.Final"
  implementation "io.netty:netty-handler:4.1.139.Final"
  implementation "io.netty:netty-handler-proxy:4.1.139.Final"
  implementation "io.netty:netty-transport:4.1.139.Final"
  implementation "com.github.gkonovalov.android-vad:silero:2.0.10"
  implementation "com.google.android.gms:play-services-location:21.3.0"
  compileOnly "com.google.firebase:firebase-messaging:25.0.1"
  compileOnly "host.exp.exponent:expo.modules.notifications:57.0.22"
  compileOnly project(":react-native-webrtc")
}
