name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm run typecheck
      - run: pnpm run check:types-coverage
      - run: pnpm run check:cycles
      - run: pnpm run check:unused
      - run: pnpm run check:spelling
      - run: pnpm run check:licenses
      - run: pnpm run check:links

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:unit
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  contracts:
    name: Dependency contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contracts

  quality:
    name: Duplication and mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:duplication
      - run: pnpm run test:mutation

  app:
    name: Application build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:expo
      - run: pnpm run build:web

  security:
    name: Secrets and vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }} --verbose

  guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No gate has been weakened
        run: pnpm run test:guards
      - name: No dependency version ranges
        run: pnpm run check:pinned
      - name: No suppressed checks
        run: |
          if grep -rInE '@ts-ignore|@ts-expect-error|\.only\(|\.skip\(|istanbul ignore' \
               --include='*.ts' --include='*.tsx' apps packages tooling; then
            echo "Suppressed checks are not permitted."
            exit 1
          fi
          if grep -rInE 'eslint-disable' --include='*.ts' --include='*.tsx' apps packages tooling \
               | grep -vE 'eslint-(disable|disable-next-line|enable) [a-z@/-]+( --.+)?$'; then
            echo "An eslint-disable must name its rule and give a reason after --."
            exit 1
          fi
      - name: No unfinished markers
        run: |
          if grep -rInE '\bTODO\b|\bFIXME\b' --include='*.ts' --include='*.tsx' apps packages tooling; then
            echo "Unfinished markers are not permitted."
            exit 1
          fi
