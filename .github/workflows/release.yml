name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes, one plain sentence of about 100 characters, a blank line, then bullets
        required: true
        type: string
      server:
        description: Public https address of the Hub the app and UI builds talk to (optional)
        required: false
        type: string
      above:
        description: Lowest Android versionCode the APK may use (optional)
        required: false
        type: string
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write the notes
        env:
          DISPATCH_NOTES: ${{ inputs.notes }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notes"
          if [ "$EVENT" = "push" ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes/notes.txt"
          else
            printf '%s\n' "$DISPATCH_NOTES" > "$RUNNER_TEMP/notes/notes.txt"
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes/notes.txt"; then
            echo "The release has no notes. Give the tag a message or fill in the notes input." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.txt
          if-no-files-found: error
          retention-days: 7

  hub:
    name: Hub service ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: pin
        run: echo "go=$(jq -r .go tooling/go2rtc/pin.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ steps.pin.outputs.go }}
          cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Build the bundle
        run: |
          set -euo pipefail
          node --import tsx tooling/provide-release.ts hub \
            --notes "$(cat "$RUNNER_TEMP/notes/notes.txt")" \
            --target "${{ matrix.target }}" \
            --out "$RUNNER_TEMP/out" --unsigned
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bundle-hub-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*.tar
          if-no-files-found: error
          retention-days: 7

  apk:
    name: Android app
    needs: prepare
    runs-on: ubuntu-latest
    environment: android-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: jdk
        run: echo "major=$(jq -r .jdkMajor tooling/build-host-pin.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: ${{ steps.jdk.outputs.major }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ''
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Android SDK packages
        run: |
          set -euo pipefail
          versions=node_modules/react-native/gradle/libs.versions.toml
          value() { sed -n "s/^$1[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" "$versions" | head -n 1; }
          platform="$(value compileSdk)"
          tools="$(value buildTools)"
          ndk="$(value ndkVersion)"
          cmake="$(jq -r .cmake tooling/build-host-pin.json)"
          for item in "$platform" "$tools" "$ndk" "$cmake"; do
            if [ -z "$item" ]; then echo "A pinned Android SDK version is missing in $versions or the pin file." >&2; exit 1; fi
          done
          sdkmanager "platforms;android-$platform" "build-tools;$tools" "ndk;$ndk" "cmake;$cmake"
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "The GOOGLE_SERVICES_JSON secret is not set." >&2; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/app/google-services.json
          git update-index --skip-worktree apps/app/google-services.json
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Build the bundle
        env:
          SERVER: ${{ inputs.server }}
          ABOVE: ${{ inputs.above }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$SERVER" ]; then extra+=(--server "$SERVER"); fi
          if [ -n "$ABOVE" ]; then extra+=(--above "$ABOVE"); fi
          node --import tsx tooling/provide-release.ts app \
            --notes "$(cat "$RUNNER_TEMP/notes/notes.txt")" \
            "${extra[@]}" \
            --out "$RUNNER_TEMP/out" --unsigned
      - name: Remove google-services.json
        if: always()
        run: rm -f apps/app/google-services.json
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bundle-apk
          path: ${{ runner.temp }}/out/*.tar
          if-no-files-found: error
          retention-days: 7

  ui:
    name: UI export ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [android, desktop]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Build the bundle
        env:
          SERVER: ${{ inputs.server }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$SERVER" ]; then extra+=(--server "$SERVER"); fi
          node --import tsx tooling/provide-release.ts ui \
            --notes "$(cat "$RUNNER_TEMP/notes/notes.txt")" \
            --target "${{ matrix.target }}" \
            "${extra[@]}" \
            --out "$RUNNER_TEMP/out" --unsigned
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bundle-ui-${{ matrix.target }}
          path: ${{ runner.temp }}/out/*.tar
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: pin
        run: echo "go=$(jq -r .go tooling/go2rtc/pin.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ steps.pin.outputs.go }}
          cache: false
      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zip unzip
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Build the bundle
        env:
          SERVER: ${{ inputs.server }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "$SERVER" ]; then extra+=(--server "$SERVER"); fi
          node --import tsx tooling/provide-release.ts desktop \
            --notes "$(cat "$RUNNER_TEMP/notes/notes.txt")" \
            --arches "x64,arm64" \
            "${extra[@]}" \
            --out "$RUNNER_TEMP/out" --unsigned
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: bundle-desktop
          path: ${{ runner.temp }}/out/*.tar
          if-no-files-found: error
          retention-days: 7

  sign-and-publish:
    name: Sign and publish
    needs: [prepare, hub, apk, ui, desktop]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: bundle-*
          path: ${{ runner.temp }}/unsigned
          merge-multiple: true
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes
      - name: Sign the bundles
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then echo "The RELEASE_SIGNING_KEY secret is not set." >&2; exit 1; fi
          mkdir -p "$RUNNER_TEMP/signed"
          count=0
          for tar in "$RUNNER_TEMP"/unsigned/*.tar; do
            node --import tsx tooling/provide-release.ts sign "$tar" --out "$RUNNER_TEMP/signed"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then echo "No bundles to sign." >&2; exit 1; fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then tag="$TAG"; else tag="build-$RUN_NUMBER-${GITHUB_SHA::7}"; fi
          gh release create "$tag" "$RUNNER_TEMP"/signed/*.tar \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes/notes.txt"
